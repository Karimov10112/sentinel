services:
  - type: web
    name: sentinel
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn "app:create_app()" --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    healthCheckPath: /api/v1/health
    envVars:
      - key: SENTINEL_SECRET
        generateValue: true
      - key: SENTINEL_API_KEY
        generateValue: true
